; ESP-1: ESP32-S3 (N16R8) + OV3660 camera, running the occupancy model.
;
; The board needs its PSRAM: the 800x600 RGB565 frame buffers and the TFLite
; tensor arena are far larger than the 320 KB of internal SRAM.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Octal PSRAM (the R8 part of N16R8).
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv

build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial goes over the S3's native USB, not a separate UART bridge.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
    ; Enable the ESP-NN hand-optimised kernels. These are what bring inference
    ; down to ~200 ms; the portable C fallback takes roughly 6.5 s per frame.
    -DESP_NN
    -DCONFIG_NN_OPTIMIZED
    -DARCH_ESP32_S3
    ; occupancy_link.h, shared with the ESP-2 sketch.
    -Iinclude

lib_deps =
    nickjgniklu/ESP_TF
